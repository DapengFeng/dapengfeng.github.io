<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Financial Statements 03: WHAT MAKES A HIGH RETURN?</title><rect width="1200" height="630" fill="#eee9dc"/><g font-family="Arial,sans-serif"><text x="65" y="62" fill="#657164" font-size="18" letter-spacing="3">FENG / FINANCIAL STATEMENTS</text><text x="1135" y="66" fill="#a45d36" font-size="32" text-anchor="end">03</text><path d="M65 90H1135M65 535H1135" stroke="#b6bdad"/><text x="65" y="153" fill="#233b38" font-size="38" >WHAT MAKES A HIGH RETURN?</text><path d="M640 225V465" stroke="#b6bdad"/><text x="80" y="255" fill="#657164" font-size="20" >SEE’S CANDIES · 1972</text><text x="80" y="350" fill="#233b38" font-size="56" >$4m / $8m</text><text x="80" y="425" fill="#38665e" font-size="66" >≈ 50%</text><text x="700" y="270" fill="#657164" font-size="20" >PRE-TAX EARNINGS</text><text x="700" y="308" fill="#233b38" font-size="23" >Relative to net tangible assets</text><text x="700" y="387" fill="#657164" font-size="20" >LOOK FOR THE MECHANISM</text><text x="700" y="425" fill="#233b38" font-size="23" >Customer preference · Capital needs</text><text x="65" y="585" fill="#657164" font-size="24" >Historical operating return ≠ the buyer’s investment return</text></g></svg>
