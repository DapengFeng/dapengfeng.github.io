<title id="title">Munger: the business behind the numbers</title>
<desc id="desc">See’s acquisition in 1972: approximate pre-tax earnings of four million dollars divided by eight million of net tangible assets or a twenty-five million purchase price. Operating capital efficiency and the buyer’s earnings yield answer different questions.</desc>
