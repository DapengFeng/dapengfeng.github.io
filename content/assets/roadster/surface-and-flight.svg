<svg xmlns="http://www.w3.org/2000/svg" width="540" height="630" viewBox="0 0 540 630" role="img" aria-labelledby="title desc">
  <title id="title">Ground, ceiling and free flight / 地面、倒挂与自由飞行</title>
  <desc id="desc">Three generalized force diagrams. On a road, suction and gravity act downward while the road normal acts upward. Under a ceiling, suction acts upward, while gravity and the ceiling normal act downward. In free flight, downward gas exhaust produces upward thrust; gravity remains downward. The blue low-pressure region is confined between the car and a nearby surface. / 三种一般化受力示意。在地面上，吸附力与重力向下，路面支持力向上。倒挂在顶面时，吸附力向上，重力和顶面支持力向下。自由飞行时，向下排气产生向上推力，重力仍向下。蓝色低压区位于车体与邻近表面之间。</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#eef4f1;font-size:30px}
    .math{font-family:Georgia,'Times New Roman',serif;font-style:italic}
    .sub{font-size:29px;font-style:normal}
    .id{font-size:29px;font-weight:600;letter-spacing:1px;fill:#91a9af}
    .force{fill:none;stroke:#80dfbd;stroke-width:5;stroke-linecap:round;marker-end:url(#force-arrow)}
    .gravity{fill:none;stroke:#ced9de;stroke-width:4;stroke-linecap:round;marker-end:url(#gravity-arrow)}
    .gas{fill:none;stroke:#f7b875;stroke-width:4;stroke-linecap:round;marker-end:url(#gas-arrow)}
    .road{stroke:#8298a0;stroke-width:3}
    .divider{stroke:#354a52;stroke-width:1}
    .pressure{fill:#8fcbe8}
    .force-label{fill:#a2efd1}
  .suction-force{stroke:#97d5f5;marker-end:url(#suction-arrow)}.thrust-force{stroke:#f4bb83;marker-end:url(#thrust-arrow)}.suction-label{fill:#97d5f5}.thrust-label{fill:#f4bb83}</style>
  <defs><marker id="suction-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#97d5f5"/></marker><marker id="thrust-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#f4bb83"/></marker>
    <marker id="force-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#80dfbd"/></marker>
    <marker id="gravity-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#ced9de"/></marker>
    <marker id="gas-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#f7b875"/></marker>
    <linearGradient id="car-red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c3d0d6"/><stop offset=".36" stop-color="#71828d"/><stop offset="1" stop-color="#35454e"/></linearGradient>
    <linearGradient id="plume-right"><stop stop-color="#f7b875" stop-opacity=".48"/><stop offset="1" stop-color="#f7b875" stop-opacity="0"/></linearGradient>
    <linearGradient id="plume-left"><stop stop-color="#f7b875" stop-opacity="0"/><stop offset="1" stop-color="#f7b875" stop-opacity=".48"/></linearGradient>
    <linearGradient id="plume-down" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7b875" stop-opacity=".48"/><stop offset="1" stop-color="#f7b875" stop-opacity="0"/></linearGradient>
    <pattern id="road-hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 14 12 0M12 14 26 0" stroke="#4b626b" stroke-width="1"/></pattern>
    <g id="coupe">
      <path d="M17 67 52 61C81 57 96 27 134 24L166 24C192 24 214 47 230 58L275 67Q287 69 289 80L281 88 26 88 13 80Z" fill="url(#car-red)" stroke="#b8c6cd" stroke-width="1.5"/>
      <path d="M92 56C106 40 117 31 136 30L165 30C182 30 199 44 213 57Z" fill="#192f3a" stroke="#a3b4bf" stroke-width="1.2"/>
      <path d="M151 31 156 57M32 69 75 66M111 67 215 67" stroke="#b7c6ce" stroke-width="1.5" fill="none"/>
      <path d="m266 71 17 3-1 5-15-2" fill="#ffeed5"/>
      <path d="M17 69 28 68 28 75 16 76" fill="#ffcab9"/>
      <path d="M30 85 271 85" stroke="#28343c" stroke-width="5"/>
      <g fill="#11212a" stroke="#a8b6bc" stroke-width="3">
        <circle cx="76" cy="81" r="18"/><circle cx="233" cy="81" r="18"/>
      </g>
      <g fill="#5e7580" stroke="#c3ced2" stroke-width="1.5">
        <circle cx="76" cy="81" r="9"/><circle cx="233" cy="81" r="9"/>
      </g>
      <g stroke="#b7c8cc" stroke-width="1.5">
        <path d="m70 75 12 12m-12 0 12-12m-6-3v18m-9-9h18"/>
        <path d="m227 75 12 12m-12 0 12-12m-6-3v18m-9-9h18"/>
      </g>
    </g>
  </defs>
  <rect width="540" height="630" rx="14" fill="#11222b"/>
  <!-- Arrows show direction only, not force magnitude or a validated flight configuration. -->
  <path class="divider" d="M24 211H516M24 410H516"/>
  <g>
    <text class="id" x="28" y="41">01</text>
    <text class="math pressure" x="77" y="69">p<tspan class="sub" dy="6">amb</tspan></text>
    <rect x="84" y="172" width="408" height="13" fill="url(#road-hatch)"/>
    <path class="road" d="M84 172H492"/>
    <path d="M216 154H332V171H216Z" fill="#78bfe7" fill-opacity=".26" stroke="#8fcbe8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <use href="#coupe" x="120" y="72"/>
    <path class="force suction-force" d="M270 43V98"/>
    <text class="math suction-label" x="289" y="61">D</text>
    <path class="gravity" d="M446 105V167"/>
    <text class="math" x="463" y="142">mg</text>
    <path class="force" d="M353 169V110"/>
    <text class="math force-label" x="371" y="126">N</text>
    <path d="M275 181V164" stroke="#8fcbe8" stroke-width="1.5"/>
    <text class="math pressure" x="247" y="201">p<tspan class="sub" dy="6">low</tspan></text>
  </g>
  <g>
    <text class="id" x="28" y="248">02</text>
    <rect x="84" y="226" width="408" height="13" fill="url(#road-hatch)"/>
    <path class="road" d="M84 239H492"/>
    <path d="M216 240H332V257H216Z" fill="#78bfe7" fill-opacity=".26" stroke="#8fcbe8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <use href="#coupe" transform="translate(120 339) scale(1 -1)"/>
    <path class="force suction-force" d="M270 369V313"/>
    <text class="math suction-label" x="289" y="363">D</text>
    <path class="gravity" d="M446 269V333"/>
    <text class="math" x="463" y="306">mg</text>
    <path class="force" d="M353 242V301"/>
    <text class="math force-label" x="371" y="288">N</text>

    <path d="M136 281H177L216 248" fill="none" stroke="#8fcbe8" stroke-width="1.5"/>
    <text class="math pressure" x="48" y="289">p<tspan class="sub" dy="6">low</tspan></text>
    <text class="math pressure" x="77" y="367">p<tspan class="sub" dy="6">amb</tspan></text>
  </g>
  <g>
    <text class="id" x="28" y="451">03</text>
    <path d="M264 539 234 617H311L279 539Z" fill="url(#plume-down)"/>
    <use href="#coupe" x="120" y="458"/>
    <path class="force thrust-force" d="M270 483V430"/>
    <text class="math thrust-label" x="290" y="455">T</text>
    <path class="gravity" d="M446 491V555"/>
    <text class="math" x="463" y="528">mg</text>
    <path class="gas" d="M271 547V607"/>
  </g>
</svg>
