<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}} · FENG</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#101310">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="{{TYPE}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{SITE_URL}}/assets/social/site.png">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="FENG Knowledge Lab" href="/feed.xml">
  <link rel="stylesheet" href="/assets/site.css">
  {{EXTRA_HEAD}}
  <script src="/assets/site.js" defer></script>
</head>
<body id="top">
  {{HEADER}}
  {{BODY}}
  {{FOOTER}}
  <dialog class="search-dialog" id="knowledge-search" aria-labelledby="search-title">
    <div class="search-top"><h2 id="search-title">搜索知识库</h2><button data-close-search aria-label="关闭搜索">Esc ×</button></div>
    <label class="search-box"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="搜索概念、文章、标签…" autocomplete="off" aria-label="搜索概念、文章、标签"></label>
    <p class="search-hint">试试「矩阵」「Rust」或「脉冲」</p>
    <div class="search-results" aria-live="polite"></div>
    <div class="search-foot">全文检索 · <span>ESC 关闭</span></div>
  </dialog>
  {{EXTRA_SCRIPTS}}
</body>
</html>
