name: Full site regression
on:
  schedule:
    - cron: '17 18 * * 6' # Sunday 02:17 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Full regression
    uses: ./.github/workflows/checks.yml
    with:
      mode: full
