name: Build and deploy knowledge lab
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '23 16 * * *' # 00:23 Asia/Shanghai: publish today's mathematics
  workflow_dispatch: # Manual publication always runs full regression.
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      mode: ${{ github.event_name == 'schedule' && 'daily' || github.event_name == 'workflow_dispatch' && 'full' || 'auto' }}
  deploy:
    if: ${{ needs.checks.outputs.site == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    needs: checks
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: checked-site
      - name: Unpack tested site
        run: |
          mkdir -p dist
          tar -xf site.tar -C dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
